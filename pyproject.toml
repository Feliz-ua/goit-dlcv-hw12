[project]
name = "goit-dlcv-hw12"
version = "0.1.0"
description = ""
authors = [
    {name = "Feliz-ua",email = "eugenepet2015@gmail.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch (==2.6.0+cu118)",
    "numpy (>=2.5.3,<3.0.0)",
    "datasets (>=5.1.0,<6.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "sacrebleu (>=2.6.0,<3.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
